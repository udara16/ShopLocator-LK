<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LankaSpot AI - Sri Lanka Business & Service Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🇱🇰 LankaSpot AI</h1>
      <p>Find contact numbers, locations, and details for <strong>any shop, service, or business</strong> in Sri Lanka.</p>
    </header>

    <div class="config-card">
      <label for="apiKey">Gemini API Key:</label>
      <input type="password" id="apiKey" placeholder="Paste your Google Gemini API Key here...">
      <small>Get a free key from <a href="https://aistudio.google.com/" target="_blank" rel="noopener noreferrer">Google AI Studio</a></small>
    </div>

    <form id="searchForm">
      <input type="text" id="queryInput" placeholder="e.g. Dentists in Kandy, Car rentals in Colombo, Plumbers in Galle..." required>
      <button type="submit" id="searchBtn">Search</button>
    </form>

    <div class="suggestions">
      <span>Try:</span>
      <button type="button" class="tag" onclick="setQuery('Emergency 24 hour pharmacies in Colombo')">Pharmacies</button>
      <button type="button" class="tag" onclick="setQuery('Top rated seafood restaurants in Negombo')">Restaurants</button>
      <button type="button" class="tag" onclick="setQuery('Solar panel installation companies in Sri Lanka')">Solar Services</button>
      <button type="button" class="tag" onclick="setQuery('AC repair and service technicians in Gampaha')">AC Repair</button>
    </div>

    <div id="loader" class="loader hidden">Searching verified Sri Lankan listings...</div>
    <div id="error" class="error-msg hidden"></div>

    <div id="resultsGrid" class="results-grid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
